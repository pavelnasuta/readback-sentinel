name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-contract-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.9"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked development environment
        run: uv sync --dev --locked
      - name: Run synthetic contract tests
        run: uv run pytest -q
