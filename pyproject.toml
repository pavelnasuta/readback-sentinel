[project]
name = "readback-sentinel"
version = "0.4.1"
description = "Local, evidence-first triage for narrated audio."
requires-python = ">=3.11"
dependencies = [
  "faster-whisper",
  "librosa",
  "matplotlib",
  "numpy",
  "pymupdf",
  "PyYAML>=6.0",
  "python-docx",
  "reportlab",
  "soundfile",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
  "ignore:.*aifc.*:DeprecationWarning",
  "ignore:.*audioop.*:DeprecationWarning",
  "ignore:.*sunau.*:DeprecationWarning",
  "ignore:builtin type Swig.*:DeprecationWarning",
  "ignore:builtin type swigvarlink.*:DeprecationWarning",
]
